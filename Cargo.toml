[workspace]
resolver = "3"
members = [
    "crates/diskpie",
    "crates/diskpie-app",
    "crates/diskpie-core",
    "crates/diskpie-platform",
    "crates/diskpie-scan",
]
default-members = ["crates/diskpie"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Luis"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Luexi/diskpie"
homepage = "https://github.com/Luexi/diskpie"

[workspace.dependencies]
eframe = { version = "=0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
fluent-bundle = "=0.16.0"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.19"
unic-langid = "=0.9.6"
windows = { version = "=0.62.2", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
