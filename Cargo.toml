[workspace]
resolver = "3"
members = [
    "crates/diskpie",
    "crates/diskpie-app",
    "crates/diskpie-core",
    "crates/diskpie-platform",
    "crates/diskpie-scan",
]
default-members = ["crates/diskpie"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Luis"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Luexi/diskpie"
homepage = "https://github.com/Luexi/diskpie"

[workspace.dependencies]
eframe = { version = "=0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
fluent-bundle = "=0.16.0"
lexopt = "=0.3.2"
raw-window-handle = "=0.6.2"
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.19"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "fmt",
    "std",
    "tracing-log",
] }
unic-langid = "=0.9.6"
windows = { version = "=0.62.2", default-features = false, features = [
    "std",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    # Only because `SHELLEXECUTEINFOW.hkeyClass` is an `HKEY`; DiskPie does
    # not read or write the registry through this feature.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` expands to absolute `::windows_core::` paths, so the crate that
# implements a COM interface must name windows-core directly. Same version and
# feature set as the one `windows` already resolves; no new package.
windows-core = { version = "=0.62.2", default-features = false, features = ["std"] }
windows-registry = { version = "=0.6.1", default-features = false, features = ["std"] }
winresource = { version = "=0.1.31", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
